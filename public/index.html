  <!-- P0: HTTPS GUARD - DEVE SER O PRIMEIRO SCRIPT (antes de qualquer module import) -->
  <!-- OWNER_OK_P14: OwnerHTTPS — https guard (reason=https-enforcement, emits=none, scope=navigation-only) -->
  <script>
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      location.replace('https://' + location.host + location.pathname + location.search + location.hash);
    }
  </script>

  <!-- P0: Theme/Density Early Init (evita flash) -->
  <script>
    (function() {
      try {
        var stored = JSON.parse(localStorage.getItem('dshowdash_theme_prefs') || '{}');
        var theme = stored.theme || 'dark';
        var density = stored.density || 'comfortable';
        var effectiveTheme = theme === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
        document.documentElement.classList.add('theme-' + theme, 'density-' + density);
        document.documentElement.setAttribute('data-theme', effectiveTheme);
        document.documentElement.setAttribute('data-density', density);
      } catch(e) {}
    })();
  </script>

  <!-- ARCO CONTEXTUAL do avatar (pedido do Jhony 2026-07-29) — o anel orbit

    .user-menu-component .user-avatar::before,
    .user-menu-dropdown-portal .user-avatar-large::before {
      background: conic-gradient(from 0deg, transparent 0%,

    .user-menu-component .user-avatar::after,

      display: block !important;
    }
    .user-menu-component .user-avatar {

        0 0 20px color-mix(in srgb, var(--avst-aro-cor, #7c3aed) 50%, transparent),
