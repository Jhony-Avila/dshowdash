    # ═══ API Admin Panels (FASE 2 — Gestao de Paineis) ═══
    # Adicionar ANTES do bloco "location ~ ^/api/(.+\.php)$" (linha ~267)

    # /api/admin/panels/* -> index.php (suporta lista, PATCH)
    location ~ ^/api/admin/panels(/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/dshowdash/api/admin/panels/index.php;
        fastcgi_param PATH_INFO $1;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_param HTTP_ORIGIN $http_origin;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_buffering off;
        fastcgi_pass_header Set-Cookie;
        fastcgi_pass_header Cookie;
    }

    # /api/admin/panels/categories -> categories.php
    location = /api/admin/panels/categories {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/dshowdash/api/admin/panels/categories.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_param HTTP_ORIGIN $http_origin;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_buffering off;
        fastcgi_pass_header Set-Cookie;
        fastcgi_pass_header Cookie;
    }

    # /api/admin/panels/{id}/screenshot -> screenshot.php
    location ~ ^/api/admin/panels/([a-zA-Z0-9_-]+)/screenshot$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/dshowdash/api/admin/panels/screenshot.php;
        fastcgi_param PANEL_ID $1;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING panel_id=$1&$query_string;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_param HTTP_ORIGIN $http_origin;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_buffering off;
        fastcgi_pass_header Set-Cookie;
        fastcgi_pass_header Cookie;
    }

    # Servir screenshots estaticamente
    location /storage/media/images/screenshots/ {
        alias /var/www/dshowdash/storage/media/images/screenshots/;
        expires 1h;
        add_header Cache-Control "public" always;
    }
